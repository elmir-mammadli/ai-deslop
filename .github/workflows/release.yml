name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the claude.ai upload
        run: cd skills && zip -r ../ai-deslop.zip ai-deslop -x "*/__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: ai-deslop.zip
          generate_release_notes: true
